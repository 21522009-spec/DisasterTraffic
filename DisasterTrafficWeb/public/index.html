<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Cảnh báo Thiên tai & Giao thông TP.HCM</title>

    <script src="/socket.io/socket.io.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        #map { width: 100%; height: 100%; }
        .toast {
            position: fixed; right: 14px; bottom: 14px; max-width: 360px;
            padding: 10px 12px; border-radius: 12px; border: 1px solid #e5e7eb;
            background: rgba(255,255,255,0.95); box-shadow: 0 8px 25px rgba(0,0,0,0.10);
            font-size: 13px; z-index: 1000;
        }
        .hidden { display: none; }
        .modal-backdrop {
            position: fixed; inset: 0; background: rgba(0,0,0,0.4);
            display: flex; align-items: center; justify-content: center; z-index: 1100;
        }
        .modal {
            width: min(520px, calc(100% - 28px)); background: #fff; border-radius: 16px;
            border: 1px solid #e5e7eb; padding: 16px; box-shadow: 0 18px 40px rgba(0,0,0,0.25);
        }
        .modal h3 { margin: 0 0 10px 0; font-weight: 700; }
        .modal .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .modal input, .modal select, .modal textarea {
            width: 100%; padding: 8px 10px; border-radius: 10px; border: 1px solid #d1d5db;
        }
        .modal textarea { min-height: 80px; resize: vertical; }
        .modal .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 12px; }
    </style>
</head>
<body class="h-screen w-screen flex overflow-hidden bg-gray-50 font-sans">

    <div class="w-80 bg-white shadow-xl z-10 flex flex-col">
        <div class="p-5 border-b">
            <h1 class="text-xl font-bold text-blue-700">DisasterTraffic</h1>
            <p class="text-sm text-gray-500">Giám sát Giao thông & Thiên tai</p>
            <!-- Auth bar -->
            <div id="auth-bar" class="mt-3"></div>
        </div>

        <div class="p-5 flex-1 overflow-y-auto">
            <h2 class="font-semibold mb-3">Bộ lọc bản đồ</h2>

            <div class="space-y-3">
                <label class="flex items-center space-x-3 cursor-pointer">
                    <input type="checkbox" id="toggle-traffic" class="form-checkbox h-5 w-5 text-blue-600" checked>
                    <span class="text-gray-700">Luồng giao thông (Traffic)</span>
                </label>
                <label class="flex items-center space-x-3 cursor-pointer">
                    <input type="checkbox" id="toggle-fire" class="form-checkbox h-5 w-5 text-red-600" checked>
                    <span class="text-gray-700">Cảnh báo Hỏa hoạn</span>
                </label>
                <label class="flex items-center space-x-3 cursor-pointer">
                    <input type="checkbox" id="toggle-flood" class="form-checkbox h-5 w-5 text-blue-400" checked>
                    <span class="text-gray-700">Cảnh báo Ngập lụt</span>
                </label>
                <label class="flex items-center space-x-3 cursor-pointer">
                    <input type="checkbox" id="toggle-other" class="form-checkbox h-5 w-5 text-gray-600" checked>
                    <span class="text-gray-700">Khác (kẹt xe, sạt lở...)</span>
                </label>
                <label class="flex items-center space-x-3 cursor-pointer">
                    <input type="checkbox" id="toggle-cameras" class="form-checkbox h-5 w-5 text-purple-600" checked>
                    <span class="text-gray-700">📷 Camera đã đăng ký</span>
                </label>
            </div>

            <div id="admin-link" class="mt-3 text-xs text-gray-500 hidden">
                <a href="/admin.html" class="text-blue-600 hover:underline">⚙️ Quản lý camera</a>
            </div>
            <div id="upgrade-link" class="mt-3 text-xs text-gray-500 hidden">
                <a href="/login.html?upgrade=1" class="text-amber-600 hover:underline">⭐ Nâng cấp để quản lý camera</a>
            </div>

            <div class="mt-6 flex gap-2 flex-wrap">
                <button id="btn-add-report" class="px-3 py-2 bg-blue-600 text-white rounded-lg text-sm hover:bg-blue-700">
                    + Báo cáo
                </button>
                <button id="btn-subscribe" class="px-3 py-2 bg-gray-100 border rounded-lg text-sm hover:bg-gray-200">
                    Theo dõi vùng
                </button>
                <button id="btn-clear-subscribe" class="px-3 py-2 bg-gray-100 border rounded-lg text-sm hover:bg-gray-200">
                    Xoá vùng
                </button>
            </div>
            <p id="sub-status" class="text-xs text-gray-500 mt-2">Chưa theo dõi vùng nào.</p>

            <div class="mt-6">
                <h2 class="font-semibold mb-3 text-red-600 flex items-center">
                    <span class="animate-pulse h-3 w-3 bg-red-600 rounded-full inline-block mr-2"></span>
                    Cảnh báo trực tiếp
                </h2>
                <ul id="alert-list" class="space-y-2 text-sm overflow-y-auto max-h-72"></ul>
            </div>
        </div>
    </div>

    <div id="map" class="flex-1 relative z-0"></div>
    <div id="toast" class="toast hidden"></div>

    <script type="module" src="/js/main.js"></script>
</body>
</html>
